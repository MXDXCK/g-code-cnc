name: Замер локальных моделей на чертежах

# При push (изменения в tests/ai-bench) запускаются только sweep и ocr; остальное — вручную (workflow_dispatch).
# Сравнение открытых Vision-моделей на эталонных чертежах Fresa (tests/fixtures/drawings).
# Только замер для разработки: модели не попадают в приложение и никуда не публикуются.
# Бесплатно: публичный репозиторий, обычные раннеры GitHub (4 ядра CPU, 16 ГБ). Сеть нужна только здесь —
# для скачивания llama.cpp (GitHub Releases) и моделей (Hugging Face). Результат — артефакт ai-bench-report.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'all — всё; vlm — сравнение моделей; sweep — Qwen3-VL-2B по контексту/квантованию; ocr — Tesseract/PaddleOCR на русских надписях; ollama — Fresa + Ollama'
        default: all
  push:
    branches-ignore: [main]
    paths: ['tests/ai-bench/**', '.github/workflows/ai-bench.yml']

permissions:
  contents: read

concurrency:
  group: ai-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vlm:
    name: ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'vlm')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: qwen3-vl-2b,    repo: Qwen/Qwen3-VL-2B-Instruct-GGUF }
          - { name: qwen3-vl-4b,    repo: Qwen/Qwen3-VL-4B-Instruct-GGUF }
          - { name: qwen2.5-vl-3b,  repo: ggml-org/Qwen2.5-VL-3B-Instruct-GGUF }
          - { name: smolvlm2-500m,  repo: ggml-org/SmolVLM2-500M-Video-Instruct-GGUF }
          - { name: smolvlm2-2.2b,  repo: ggml-org/SmolVLM2-2.2B-Instruct-GGUF }
          - { name: internvl3-1b,   repo: ggml-org/InternVL3-1B-Instruct-GGUF }
    steps:
      - uses: actions/checkout@v4
      - name: llama.cpp (последний релиз, CPU, Linux x64; если сборки под Linux нет — из исходников)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p llama && cd llama
          gh release view --repo ggml-org/llama.cpp --json tagName,assets -q '.tagName, .assets[].name' | tee assets.txt
          A=$(tail -n +2 assets.txt | grep -i ubuntu | grep -iE 'x64|x86_64|amd64' | grep -viE 'vulkan|cuda|rocm|hip|sycl|s390|arm|aarch|openvino|kleidi' | head -1 || true)
          if [ -n "$A" ]; then
            gh release download --repo ggml-org/llama.cpp --pattern "$A" --clobber
            case "$A" in *.zip) unzip -q "$A";; *.tar.gz) tar xzf "$A";; esac
          else
            echo "готовой сборки нет — собираю llama-mtmd-cli из исходников"
            git clone --depth 1 https://github.com/ggml-org/llama.cpp src
            cmake -S src -B build -DLLAMA_CURL=OFF -DGGML_NATIVE=ON -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j 4 --target llama-mtmd-cli
          fi
          CLI=$(find "$PWD" -name llama-mtmd-cli -type f | head -1); test -n "$CLI"; echo "CLI=$CLI" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$(dirname "$CLI"):$(find "$PWD" -name 'libggml*.so' -printf '%h\n' | sort -u | tr '\n' ':')" >> $GITHUB_ENV
          head -1 assets.txt > ../llama-version.txt; echo "файл: ${A:-из исходников}" >> ../llama-version.txt
      - name: Модель ${{ matrix.name }} (Hugging Face)
        id: m
        run: python3 tests/ai-bench/fetch_model.py '${{ matrix.repo }}' models
      - name: Замер на эталонных чертежах
        run: |
          pip install --quiet pillow
          mkdir -p results
          python3 tests/ai-bench/run_llama.py --cli "$CLI" --model '${{ steps.m.outputs.model }}' --mmproj '${{ steps.m.outputs.mmproj }}' \
            --name '${{ matrix.name }}' --out results --threads 4 --ctx 16384
          cp models/meta.json 'results/${{ matrix.name }}.meta.json'
          cp llama-version.txt 'results/${{ matrix.name }}.llama.txt'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'ai-bench-${{ matrix.name }}', path: results, retention-days: 30 }

  paddleocr:
    name: paddleocr (PP-OCRv5)
    if: github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'ocr'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --quiet paddlepaddle paddleocr
      - run: cd tests/ai-bench && python3 run_paddle.py ../../results
      - run: du -sh ~/.paddlex/official_models/* 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ai-bench-paddleocr, path: results, retention-days: 30 }

  fresa-ollama:
    name: Fresa + Ollama (настоящая модель, сквозной тест)
    if: github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'ollama')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Ollama (официальная установка) и модель qwen3-vl:2b
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          OLLAMA_ORIGINS='*' nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags && break; sleep 2; done
          ollama --version | tee ollama-version.txt
          # нужен instruct-вариант: «qwen3-vl:2b» в Ollama — думающий (рассуждает до конца лимита, JSON не выдаёт)
          M=""; for t in qwen3-vl:2b-instruct qwen3-vl:2b-instruct-q4_K_M qwen3-vl:2b-instruct-q8_0 qwen3-vl:2b; do
            if ollama pull "$t"; then M="$t"; break; fi; done
          test -n "$M"; echo "FRESA_OLLAMA_MODEL=$M" >> $GITHUB_ENV; ollama list; ollama show "$M" | head -30
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Fresa в браузере → Ollama → подсказки
        env: { CI: '1', FRESA_REAL_OLLAMA: '1' }
        run: npx playwright test tests/e2e/ai-ollama-real.spec.js --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: fresa-ollama-real, path: 'test-results/ollama-real.json', retention-days: 30 }

  # Qwen3-VL-2B (главный кандидат для Android): память и скорость при разном контексте, кванте, размере картинки, кэше KV
  sweep:
    name: 'qwen3-vl-2b ${{ matrix.q }} ctx${{ matrix.ctx }} ${{ matrix.px }}px ${{ matrix.tag }}'
    if: github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { q: Q4_K_M, mm: F16,  ctx: 4096,  px: 1280, tag: '', extra: '' }
          - { q: Q4_K_M, mm: F16,  ctx: 8192,  px: 1280, tag: '', extra: '' }
          - { q: Q4_K_M, mm: F16,  ctx: 4096,  px: 896,  tag: '', extra: '' }
          - { q: Q4_K_M, mm: F16,  ctx: 4096,  px: 640,  tag: '', extra: '' }
          - { q: Q4_K_M, mm: Q8_0, ctx: 4096,  px: 1280, tag: '', extra: '' }
          - { q: Q8_0,   mm: F16,  ctx: 4096,  px: 1280, tag: '', extra: '' }
          - { q: Q4_K_M, mm: F16,  ctx: 4096,  px: 1280, tag: kvq8, extra: '-fa on -ctk q8_0 -ctv q8_0' }
    steps:
      - uses: actions/checkout@v4
      - name: llama.cpp (последний релиз, CPU, Linux x64)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p llama && cd llama
          gh release view --repo ggml-org/llama.cpp --json tagName,assets -q '.tagName, .assets[].name' | tee assets.txt
          A=$(tail -n +2 assets.txt | grep -i ubuntu | grep -iE 'x64|x86_64|amd64' | grep -viE 'vulkan|cuda|rocm|hip|sycl|s390|arm|aarch|openvino|kleidi' | head -1)
          gh release download --repo ggml-org/llama.cpp --pattern "$A" --clobber
          case "$A" in *.zip) unzip -q "$A";; *.tar.gz) tar xzf "$A";; esac
          CLI=$(find "$PWD" -name llama-mtmd-cli -type f | head -1); test -n "$CLI"; echo "CLI=$CLI" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$(dirname "$CLI"):$(find "$PWD" -name 'libggml*.so' -printf '%h\n' | sort -u | tr '\n' ':')" >> $GITHUB_ENV
          head -1 assets.txt > ../llama-version.txt
      - id: m
        run: python3 tests/ai-bench/fetch_model.py Qwen/Qwen3-VL-2B-Instruct-GGUF models '${{ matrix.q }}' '${{ matrix.mm }}'
      - name: Замер
        run: |
          pip install --quiet pillow
          N='qwen3vl2b-${{ matrix.q }}-mm${{ matrix.mm }}-c${{ matrix.ctx }}-p${{ matrix.px }}${{ matrix.tag && format('-{0}', matrix.tag) || '' }}'
          mkdir -p results
          python3 tests/ai-bench/run_llama.py --cli "$CLI" --model '${{ steps.m.outputs.model }}' --mmproj '${{ steps.m.outputs.mmproj }}' \
            --name "$N" --out results --threads 4 --ctx ${{ matrix.ctx }} --maxpx ${{ matrix.px }} --extra '${{ matrix.extra }}'
          cp models/meta.json "results/$N.meta.json"; cp llama-version.txt "results/$N.llama.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'ai-bench-sweep-${{ strategy.job-index }}', path: results, retention-days: 30 }

  # Tesseract.js (тот же, что в Fresa): eng / rus / rus+eng / комбинация на русских надписях и на эталонных чертежах
  ocr:
    name: tesseract.js eng/rus
    if: github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'ocr'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: mkdir -p /tmp/t && cd /tmp/t && npm init -y >/dev/null && npm install --no-audit --no-fund tesseract.js@5.1.1
      - run: cd /tmp/t && node $GITHUB_WORKSPACE/tests/ai-bench/run_tess.mjs $GITHUB_WORKSPACE/results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ai-bench-tesseract, path: 'results/tesseract.json', retention-days: 30 }

  report:
    needs: [vlm, paddleocr, sweep, ocr]
    if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only == 'ollama')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'ai-bench-*', path: results, merge-multiple: true }
      - name: Сводка
        run: |
          python3 tests/ai-bench/report.py results | tee report.md
          { echo '## Локальные модели на эталонных чертежах'; echo; cat report.md; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with: { name: ai-bench-report, path: 'report.md', retention-days: 30 }
