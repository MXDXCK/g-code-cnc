name: Сборка APK и EXE

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'version.json'
      - 'android/**'
      - 'windows/**'
      - 'icons/**'
      - 'privacy.html'
      - 'terms.html'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  web:
    name: Офлайн-сборка страницы
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=$(python3 -c 'import json;print(json.load(open("version.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - name: Страница + three.js локально (без интернета)
        run: |
          mkdir -p dist/lib
          cp index.html version.json manifest.webmanifest privacy.html terms.html dist/
          cp -r icons dist/icons
          curl -fsSL https://unpkg.com/three@0.160.0/build/three.module.js -o dist/lib/three.module.js
          curl -fsSL https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js -o dist/lib/OrbitControls.js
          # распознавание фото (Tesseract.js) — тоже внутрь приложения, чтобы работало без интернета
          T=dist/lib/tesseract; mkdir -p $T
          curl -fsSL https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js -o $T/tesseract.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js -o $T/worker.min.js
          for f in tesseract-core-lstm.wasm.js tesseract-core-lstm.wasm tesseract-core-simd-lstm.wasm.js tesseract-core-simd-lstm.wasm; do
            curl -fsSL https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/$f -o $T/$f
          done
          curl -fsSL https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int/eng.traineddata.gz -o $T/eng.traineddata.gz
          ls -la $T
          python3 - <<'PY'
          import re
          p = 'dist/index.html'
          s = open(p, encoding='utf-8').read()
          s, n = re.subn(r'<script type="importmap">.*?</script>',
                         '<script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/controls/OrbitControls.js":"./lib/OrbitControls.js"}}</script>',
                         s, flags=re.S)
          assert n == 1, 'importmap not found'
          s, n = re.subn(r'const OCR_LOCAL=false;', 'const OCR_LOCAL=true;', s)
          assert n == 1, 'OCR_LOCAL not found'
          open(p, 'w', encoding='utf-8').write(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist

  android:
    name: Android APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: android/app/src/main/assets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ключ подписи из секретов
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Подпись: ключ из секретов"
          else
            echo "::warning::Секрет ANDROID_KEYSTORE не задан — APK подписан тестовым ключом (не для магазина)"
          fi
      - name: Сборка APK и AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle -p android assembleRelease bundleRelease --no-daemon
      - name: Имя файла
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Fresa-${{ needs.web.outputs.version }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/Fresa-${{ needs.web.outputs.version }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*

  windows:
    name: Windows EXE
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: windows/web
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Сборка одного exe-файла
        shell: pwsh
        run: |
          dotnet publish windows/GcodeCNC.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -o out
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item out/Fresa.exe "dist/Fresa-${{ needs.web.outputs.version }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/*.exe

  release:
    name: Публикация в Releases
    needs: [web, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
          pattern: '{apk,exe}'
      - name: Описание версии
        run: |
          python3 - <<'PY'
          import json
          j = json.load(open('version.json', encoding='utf-8'))
          lines = ['## Что нового', ''] + ['- ' + n for n in j.get('notes', [])] + ['',
            '**Android** — скачайте `.apk` и установите. `.aab` — файл для магазинов (RuStore, Google Play).',
            '**Windows 10/11** — скачайте `.exe` и запустите, установка не нужна. F11 — полный экран.',
            '**iPhone** — https://mxdxck.github.io/g-code-cnc/ в Safari → «Поделиться» → «На экран „Домой“».']
          open('notes.md', 'w', encoding='utf-8').write('\n'.join(lines))
          PY
      - uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.web.outputs.version }}
          name: Fresa ${{ needs.web.outputs.version }}
          bodyFile: notes.md
          artifacts: files/*
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          makeLatest: true
