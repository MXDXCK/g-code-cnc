name: Проверка сборки (без публикации)

# ТЕСТОВЫЕ сборки из рабочей ветки: APK «Fresa ТЕСТ» (app.fresa.cnc.test — отдельное приложение рядом с Fresa из RuStore,
# отладочная подпись, свои данные) и EXE «Fresa-TEST» (свои данные). Проверяет, что новые файлы попадают в приложения.
# Ничего не публикует: нет Release, нет RuStore. Файлы — только во вкладке Actions, 14 дней. Инструкция — docs/TEST_BUILD.md.
on:
  push:
    branches-ignore: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'android/**'
      - 'windows/**'
      - 'sw.js'
      - '.github/workflows/build-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Номер тестовой сборки
        id: tag
        run: |
          V=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "tag=test.${{ github.run_number }}+${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - name: Страница + библиотеки (как в build.yml)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p dist/lib
          cp index.html version.json manifest.webmanifest privacy.html terms.html dist/
          cp -r icons dist/icons
          cp -r src dist/src
          curl -fsSL https://unpkg.com/three@0.160.0/build/three.module.js -o dist/lib/three.module.js
          curl -fsSL https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js -o dist/lib/OrbitControls.js
          T=dist/lib/tesseract; mkdir -p $T
          curl -fsSL https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js -o $T/tesseract.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js -o $T/worker.min.js
          for f in tesseract-core-lstm.wasm.js tesseract-core-lstm.wasm tesseract-core-simd-lstm.wasm.js tesseract-core-simd-lstm.wasm; do
            curl -fsSL https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/$f -o $T/$f
          done
          curl -fsSL https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int/eng.traineddata.gz -o $T/eng.traineddata.gz
          # русский словарь — второй проход OCR по надписям чертежей («Толщина», «Глубина», «Сквозное»…), ~5 МБ
          curl -fsSL https://cdn.jsdelivr.net/npm/@tesseract.js-data/rus@1.0.0/4.0.0_best_int/rus.traineddata.gz -o $T/rus.traineddata.gz
          gunzip -f $T/rus.traineddata.gz
          gunzip -f $T/eng.traineddata.gz
          # чертежи PDF (pdf.js, Apache-2.0) — внутрь приложения; .js вместо .mjs, чтобы WebView отдал файл как скрипт
          P=dist/lib/pdfjs; mkdir -p $P
          curl -fsSL https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/legacy/build/pdf.min.mjs -o $P/pdf.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/legacy/build/pdf.worker.min.mjs -o $P/pdf.worker.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/LICENSE -o $P/LICENSE
          python3 - <<'PY'
          import re
          p = 'dist/index.html'
          s = open(p, encoding='utf-8').read()
          s, n = re.subn(r'<script type="importmap">.*?</script>',
                         '<script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/controls/OrbitControls.js":"./lib/OrbitControls.js"}}</script>',
                         s, flags=re.S)
          assert n == 1
          s, n = re.subn(r'const OCR_LOCAL=false;', 'const OCR_LOCAL=true;', s)
          assert n == 1
          import os
          s, n = re.subn(r"const BUILD_TAG='';", "const BUILD_TAG='" + os.environ['TAG'] + "';", s)
          assert n == 1, 'BUILD_TAG not found'
          open(p, 'w', encoding='utf-8').write(s)
          PY
      - uses: actions/upload-artifact@v4
        with: { name: web, path: dist, retention-days: 3 }

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web, path: android/app/src/main/assets }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: APK «Fresa ТЕСТ» (app.fresa.cnc.test, отладочная подпись; ключ релиза не используется)
        env:
          FRESA_TEST_SUFFIX: -${{ needs.web.outputs.tag }}
        run: gradle -p android assembleBeta --no-daemon
      - name: В APK есть модули и распознавание, applicationId — тестовый
        run: |
          A=android/app/build/outputs/apk/beta/app-beta.apk
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$BT/aapt dump badging $A | tee badging.txt | head -3
          grep -q "package: name='app.fresa.cnc.test'" badging.txt
          grep -q "versionName='${{ needs.web.outputs.version }}-${{ needs.web.outputs.tag }}'" badging.txt
          mkdir -p out && cp $A "out/Fresa-TEST-${{ needs.web.outputs.version }}-${{ needs.web.outputs.tag }}.apk"
          unzip -l $A | tee list.txt | grep -q 'assets/src/storage/idb.js'
          grep -q 'assets/lib/tesseract/eng.traineddata' list.txt
          grep -q 'assets/lib/tesseract/rus.traineddata' list.txt
          grep -q 'assets/lib/pdfjs/pdf.min.js' list.txt
          grep -q 'assets/src/drawing/pipeline.js' list.txt
          echo "OK: src/, tesseract и pdf.js в APK"
      - uses: actions/upload-artifact@v4
        with: { name: Fresa-TEST-android, path: out/*.apk, retention-days: 14 }

  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web, path: windows/web }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Сборка и список встроенных файлов
        shell: pwsh
        run: |
          dotnet build windows/GcodeCNC.csproj -c Release -o bout -p:FresaTest=true
          $asm = [System.Reflection.Assembly]::LoadFile((Resolve-Path bout/Fresa-TEST.dll))
          $names = $asm.GetManifestResourceNames() | ForEach-Object { $_.Replace('\','/') }
          $names | Sort-Object | Out-File res.txt
          Get-Content res.txt
          foreach ($need in 'web/index.html','web/lib/three.module.js','web/lib/tesseract/eng.traineddata','web/lib/tesseract/rus.traineddata','web/lib/pdfjs/pdf.min.js','web/src/storage/idb.js','web/src/drawing/pipeline.js') {
            if (-not ($names -contains $need)) { Write-Error "нет в EXE: $need"; exit 1 }
          }
          Write-Host "OK: все нужные файлы встроены"
      - name: Для сравнения — csproj из main (до исправления)
        shell: pwsh
        continue-on-error: true
        run: |
          git fetch --depth=1 origin main
          git show origin/main:windows/GcodeCNC.csproj | Out-File -Encoding utf8 windows/Old.csproj
          dotnet build windows/Old.csproj -c Release -o oldout
          $asm = [System.Reflection.Assembly]::LoadFile((Resolve-Path oldout/Fresa.dll))
          $old = $asm.GetManifestResourceNames()
          Write-Host ("в EXE из main встроено файлов: " + $old.Count)
          if ($old -contains 'web/lib/tesseract/eng.traineddata') { Write-Host "main: распознавание фото встроено" } else { Write-Host "main: распознавание фото НЕ встроено (подтверждение K-01)" }
      - name: Тестовый EXE одним файлом (как в build.yml, но «Fresa-TEST», свои данные)
        shell: pwsh
        run: |
          dotnet publish windows/GcodeCNC.csproj -c Release -r win-x64 --self-contained true -p:FresaTest=true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -o out
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item out/Fresa-TEST.exe ("dist/Fresa-TEST-${{ needs.web.outputs.version }}-${{ needs.web.outputs.tag }}.exe".Replace('+', '_'))
      - uses: actions/upload-artifact@v4
        with: { name: Fresa-TEST-windows, path: dist/*.exe, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        with: { name: exe-resources, path: res.txt, retention-days: 3 }
