plugins { id 'com.android.application' }

def ver = new groovy.json.JsonSlurper().parse(file('../../version.json')).version
def parts = ver.tokenize('.').collect { it as int }
def code = parts[0] * 10000 + parts[1] * 100 + (parts.size() > 2 ? parts[2] : 0)

android {
    namespace 'ru.mxdxck.gcodecnc'
    compileSdk 34
    defaultConfig {
        applicationId 'app.fresa.cnc'
        minSdk 24
        targetSdk 34
        versionCode code
        versionName ver
    }
    // Ключ подписи для магазинов берётся из секретов GitHub (ANDROID_KEYSTORE …).
    // Пока секретов нет — тестовая подпись старым ключом из репозитория (только для проверки, не для RuStore).
    def ksFile = System.getenv('ANDROID_KEYSTORE_FILE')
    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'fresa'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            } else {
                storeFile file('../release.keystore')
                storePassword 'gcodecnc'
                keyAlias 'gcnc'
                keyPassword 'gcodecnc'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
